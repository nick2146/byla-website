name: BYLA Markets checks
on:
  push:
    branches: [stock-simulator-foundation]
    paths: ['stock-simulator/**']
  pull_request:
    paths: ['stock-simulator/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock-simulator/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-server-only
          MARKET_DATA_API_KEY: build-placeholder-server-only
